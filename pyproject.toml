[project]
name = "clawpy"
version = "0.1.0"
description = "个人专属 AI 助手（OpenClaw 升级版）"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "redis>=8.1.0",
    "apscheduler>=3.11.3",
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
